# Production config: serves the built web app from the same Worker.
# Optional secrets for TURN relay: wrangler secret put TURN_KEY_ID / TURN_API_TOKEN
name = "couchline"
main = "src/index.ts"
compatibility_date = "2025-06-01"

[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/ws/*"]

[durable_objects]
bindings = [{ name = "ROOM", class_name = "Room" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
